{% extends "layout.html" %}

{% block title %}
Edit reference
{% endblock %}

{% block body %}

<h2>Edit reference</h2>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit reference</title>
</head>
<body>
  <p>{{ reference.type }}</p>
  <p>{{ reference.citation_key }}</p>
  <p>{{ reference.author }}</p>
  <p>{{ reference.title }}</p>
  <p>{{ reference.publishing_year }}</p>
  <a href="/view_references">Confirm changes</a>
</body>
</html>

{% endblock %}
