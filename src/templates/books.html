<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book references</title>
</head>
<body>

  {% if books %}
    <table border="1">
      <tr>
        <th>Citation key</th>
        <th>Author</th>
        <th>Title</th>
        <th>Publishing year</th>
        <th>Publisher</th>
      </tr>
      {% for book in books %}
        <tr>
          <td>{{ book.citation_key }}</td>
          <td>{{ book.author }}</td>
          <td>{{ book.title }}</td>
          <td>{{ book.publishing_year }}</td>
          <td>{{ book.publisher }}</td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>No books added yet.</p>
  {% endif %}
  <a href="/new_book">Add new book</a>
</body>
</html>
