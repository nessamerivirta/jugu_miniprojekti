<div id="filterdiv"
    <h2>Filters</h2>

    <table>
        <tr>
            <td>
                <label for="cbauthor">Author</label>
                <input type="checkbox" id="cbauthor" name="cbauthor"/>
            </td>
            <td>
                <label for="cbpub_year">Publication year</label>
                <input type="checkbox" id="cbpub_year" name="cbpub_year"/>
            </td>
            <td>
                <label for="cbtitle">Title</label>
                <input type="checkbox" id="cbtitle" name="cbtitle"/>
            </td>
        </tr>
        <tr>
            <td>
                <input type="text" id="txtauthor" name="txtauthor"
            </td>
            <td>
                <input type="text" id="txtpub_year" name="txtpub_year"
            </td>
           <td>
                <input type="text" id="txttitle" name="txttitle"
            </td>
        </tr>

    </table>
</div>
